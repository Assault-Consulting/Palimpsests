name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: CI only needs to read the repo. Declaring this
# at the top level (and granting nothing more per-job) is what the OpenSSF
# Scorecard Token-Permissions check looks for.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Lint WITHOUT an editable install of the package. This is the fix
      # for a subtle isort divergence: when `palimpsests` is pip-installed
      # (via -e .), ruff's isort sees it as an installed third-party
      # package and regroups first-party imports differently than it does
      # from the src-layout heuristic alone — which passed locally but
      # failed in CI. Linting a plain checkout keeps `palimpsests`
      # first-party by the src heuristic, deterministically.
      - name: Install ruff only
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.20

      - name: Lint (ruff)
        run: |
          ruff --version
          ruff check --output-format=full .

      # Relative links in the Markdown must resolve. Done by a machine on
      # every push rather than by a one-off audit: the first version of
      # this check found four broken links in a run record that a manual
      # report had passed as clean. (scripts/check_links.py shipped
      # earlier without this step — the gap it exists to close.)
      - name: Check relative links in Markdown
        run: python scripts/check_links.py

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (pytest)
        run: pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # The job name is deliberately just "coverage" — stable — so the
    # branch-protection required-check never has to be re-pointed when the
    # thresholds change. The actual bars live in the step names and in
    # scripts/coverage_gate.py: OpenSSF Gold, statement >= 90 and branch
    # >= 80, enforced together. Measured on one target, not the full OS x
    # version matrix: coverage does not vary by platform, and this is a
    # gate, not a portability check. The one deliberately-uncovered module
    # is the hardware-only ctypes backend (see pyproject
    # [tool.coverage.report]); it is counted, not omitted.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install SoftHSM2 (tier-B anchor tests run here, ADR-0004)
        run: sudo apt-get update -q && sudo apt-get install -y -q softhsm2

      - name: Install (base + dev + pkcs11)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" python-pkcs11

      - name: Coverage (statement + branch)
        run: pytest --cov=palimpsests --cov-report=term-missing --cov-report=json

      - name: Gold coverage gate (statement >= 90, branch >= 80)
        run: python scripts/coverage_gate.py

  encrypted-audit:
    name: suite with the encryption extra
    runs-on: ubuntu-latest
    # The suite was green without SQLCipher and red with it: ten tests
    # tampered with the audit database through plain sqlite3, which
    # AuditLog does not write once sqlcipher3 is importable. Nothing in
    # CI installed the extra, so the failure lived on exactly the
    # installs the extra exists for.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install (base + dev + encryption)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" sqlcipher3-binary

      - name: The encryption extra is actually present
        run: python -c "import sqlcipher3; print('sqlcipher3 imported')"

      - name: Test (pytest)
        run: pytest -q

  reproducible-build:
    name: reproducible-build
    runs-on: ubuntu-latest
    # OpenSSF Gold build_reproducible: prove the sdist and wheel are a pure
    # function of the source by building twice and requiring bit-for-bit
    # identical bytes. SOURCE_DATE_EPOCH is pinned to the commit date (in
    # the script) so any rebuild from the same commit reproduces the
    # artifacts. Reproduction recipe: docs/REPRODUCIBLE-BUILD.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Verify reproducible build (build twice, diff hashes)
        run: bash scripts/check_reproducible_build.sh

  pala-vectors:
    name: pala-1 vectors reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The committed test vectors must be reproducible from the reference
      # implementation, byte for byte. If this fails, either the reference
      # drifted from the vectors or the vectors were edited by hand — both
      # make the specification unfalsifiable, which is the one property it
      # cannot lose.
      - name: Regenerate and compare
        run: |
          python -m pip install --upgrade pip
          pip install cryptography
          cd docs/specs/pala-1
          cp test-vectors.json /tmp/committed.json
          python gen_vectors.py
          cmp test-vectors.json /tmp/committed.json && echo "vectors reproduce byte-for-byte"
      # The companion vectors carry their own gate; the frozen core
      # vectors above are untouched by them by construction, and the cmp
      # above would catch any drift regardless. The companion set grows
      # additively across profile revisions (r2, r3, ...), so the step
      # name stays revision-free on purpose.
      - name: Regenerate and compare (inference profile companions)
        working-directory: docs/specs/pala-1/profiles
        run: |
          cp inference-vectors.json /tmp/committed-companion.json
          python gen_inference_vectors.py
          cmp inference-vectors.json /tmp/committed-companion.json && echo "companion vectors reproduce byte-for-byte"

  clean-room:
    name: clean-room install
    runs-on: ubuntu-latest
    # A user with nothing but `pip install palimpsests`. The wheel is built
    # from this commit and installed into an empty virtualenv in a
    # directory that is not the checkout, so nothing on sys.path can mask
    # a missing dependency or a packaging mistake; then the README's own
    # first three commands run exactly as written. selftest is the build's
    # own tripwire; the demo and the verify are the user's first minute.
    # (The first version of this job caught the demo crashing on a base
    # install with ModuleNotFoundError: numpy.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel -o /tmp/dist .

      - name: Install into an empty environment and run the quickstart
        run: |
          mkdir -p /tmp/clean-room && cd /tmp/clean-room
          python -m venv venv
          ./venv/bin/pip install --quiet /tmp/dist/*.whl
          ./venv/bin/palimpsests demo
          # The runner's shell is `bash -e`: a non-zero exit aborts the step
          # before `rc=$?` could run. Capture it on the same line instead.
          rc=0; ./venv/bin/palimpsests pala verify palimpsests-demo.pala || rc=$?
          test "$rc" -eq 2 || { echo "expected PARTIAL (2) without an anchor, got $rc"; exit 1; }
          ./venv/bin/palimpsests pala selftest

      # The serve as a process, which nothing else in CI exercises: the
      # coverage job installs the dev extra (fastapi, no uvicorn) and the
      # step above installs the base wheel. With no engine on the runner,
      # an honest serve answers /v1/models with 503 engine_unavailable —
      # anything else (a 500 with a traceback, a refused connection) is
      # the class of defect a real traffic run found here first.
      - name: Start the serve; an unreachable engine is a clean 503
        run: |
          cd /tmp/clean-room
          ./venv/bin/pip install --quiet fastapi uvicorn
          export PALIMPSESTS_ALLOW_UNENCRYPTED_AUDIT=1
          ./venv/bin/palimpsests-serve --port 11439 &
          serve_pid=$!
          code=""
          for _ in $(seq 1 40); do
            code=$(curl -s -o /tmp/models.json -w '%{http_code}' \
              http://127.0.0.1:11439/v1/models || true)
            [ -n "$code" ] && [ "$code" != "000" ] && break
            sleep 0.5
          done
          echo "GET /v1/models -> $code"; cat /tmp/models.json; echo
          kill "$serve_pid"
          wait "$serve_pid" 2>/dev/null || true
          test "$code" = "503" || { echo "expected 503, got $code"; exit 1; }
          grep -q engine_unavailable /tmp/models.json || {
            echo "503 without the engine_unavailable code"; exit 1; }

      # And the refusal path: without the escape hatch and without
      # SQLCipher, the serve must name the problem and exit rather than
      # bind a port it cannot serve from.
      - name: A serve that cannot open its audit log exits with the reason
        run: |
          cd /tmp/clean-room
          rc=0
          out=$(./venv/bin/palimpsests-serve --port 11440 2>&1) || rc=$?
          echo "$out"
          test "$rc" -eq 1 || { echo "expected exit 1, got $rc"; exit 1; }
          echo "$out" | grep -q "palimpsests\[encryption\]" || {
            echo "the remedy was not printed"; exit 1; }

  ci-complete:
    name: ci-complete
    # The single fan-in context for branch protection. Requiring individual
    # jobs is brittle in two ways: matrix job names ("test (ubuntu-latest,
    # py3.12)") change when the matrix changes, and a required context that
    # stops being reported leaves every PR stuck on "Expected — waiting for
    # status" with no failure to debug. Protect THIS job instead: it runs
    # unconditionally (if: always()), depends on every other CI job, and
    # fails unless all of them succeeded — one stable name, reported on
    # every PR, immune to renames above it.
    if: always()
    needs: [lint, test, coverage, encrypted-audit, reproducible-build, pala-vectors, clean-room]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          echo "lint:               ${{ needs.lint.result }}"
          echo "test:               ${{ needs.test.result }}"
          echo "coverage:           ${{ needs.coverage.result }}"
          echo "encrypted-audit:    ${{ needs['encrypted-audit'].result }}"
          echo "reproducible-build: ${{ needs['reproducible-build'].result }}"
          echo "pala-vectors:       ${{ needs['pala-vectors'].result }}"
          echo "clean-room:         ${{ needs['clean-room'].result }}"
          if [ "${{ needs.lint.result }}" != "success" ] \
             || [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.coverage.result }}" != "success" ] \
             || [ "${{ needs['encrypted-audit'].result }}" != "success" ] \
             || [ "${{ needs['reproducible-build'].result }}" != "success" ] \
             || [ "${{ needs['pala-vectors'].result }}" != "success" ] \
             || [ "${{ needs['clean-room'].result }}" != "success" ]; then
            echo "one or more required CI jobs did not succeed"
            exit 1
          fi
