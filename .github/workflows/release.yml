name: release

# Publish to PyPI on a version tag. Build, publish, and release are split
# so the OIDC-scoped publish job has the narrowest possible permissions,
# and so the built artifacts are visible even if publishing is skipped.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token is stored
# in the repo. The trusted publisher must be configured once on PyPI for
# project "palimpsests", workflow "release.yml", environment "pypi"
# (a pending publisher works before the first release, so the first tag
# creates the project). Until that is configured, the publish step fails
# harmlessly; the build job still runs.
#
# The build job also generates a CycloneDX SBOM into its own directory
# (NOT dist/ — see the SBOM step). The release job publishes a GitHub
# Release carrying the wheel, sdist, and SBOM as downloadable assets
# (which also makes the CHANGELOG's per-version release links resolve).
#
# The provenance job runs last and on its own: it attests the same wheel
# and sdist and attaches the signed bundle to the GitHub Release as
# palimpsests.intoto.jsonl. Nothing depends on it, so a failure there
# leaves the PyPI publication and the release as they are; the job can be
# re-run.

on:
  push:
    tags:
      - "v*"

# Least-privilege default for the whole workflow. Each job below additively
# grants only the scope it needs (publish: id-token; release: contents;
# provenance: id-token, attestations, contents) —
# the pattern the OpenSSF Scorecard Token-Permissions check rewards.
permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        # Deterministic build: pin SOURCE_DATE_EPOCH to the tagged commit's
        # date and fix locale/umask, so the published artifacts are the same
        # bit-for-bit ones a third party gets rebuilding from this tag (the
        # CI reproducible-build job verifies this on every change; recipe in
        # docs/REPRODUCIBLE-BUILD.md).
        env:
          LC_ALL: C.UTF-8
          TZ: UTC
        run: |
          python -m pip install --require-hashes -r .github/requirements/release.txt
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          umask 0022
          python -m build

      - name: Check metadata
        run: |
          python -m twine check dist/*

      - name: Generate SBOM (CycloneDX)
        # The SBOM is written to sbom/, deliberately NOT dist/. dist/ is what
        # the publish job uploads to PyPI, and gh-action-pypi-publish validates
        # every file in it — a .cdx.json there fails as "Unknown distribution
        # format" and blocks the whole upload. Keeping the SBOM in its own
        # directory (and its own artifact) keeps the PyPI upload to wheel +
        # sdist only, while the release job still attaches it.
        #
        # Built from a *clean* throwaway venv holding only the freshly built
        # wheel and its runtime closure, so build tooling never enters the SBOM.
        # --output-reproducible drops timestamps; cyclonedx-bom is pinned.
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/python -m pip install dist/*.whl
          mkdir -p sbom
          cyclonedx-py environment /tmp/sbom-venv \
            --mc-type library \
            --pyproject pyproject.toml \
            --output-reproducible \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file sbom/palimpsests.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment gates the release and scopes the OIDC token. Create
    # an environment named "pypi" in the repo settings; optionally add a
    # required reviewer there for a manual approval gate on every publish.
    environment:
      name: pypi
      url: https://pypi.org/p/palimpsests
    permissions:
      # id-token: write is what lets PyPI verify this workflow via OIDC.
      # Granted only to this job — the rest of the workflow stays read-only.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job only: create the GitHub Release for the tag and
      # upload the distribution files plus the SBOM as assets. The rest of
      # the workflow stays contents: read.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom
          path: sbom/

      - name: Create or update GitHub Release with SBOM asset
        # Idempotent: if a release for this tag already exists (for example,
        # one created from the Releases UI while tagging), upload/replace the
        # assets on it instead of failing; otherwise create it. Uses the
        # runner's gh CLI — no third-party action added. --verify-tag ties the
        # release to the pushed git tag; --generate-notes builds notes from
        # merged PRs (only on first creation).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/*.whl \
              dist/*.tar.gz \
              sbom/palimpsests.cdx.json \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.whl \
              dist/*.tar.gz \
              sbom/palimpsests.cdx.json \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  provenance:
    name: build provenance
    # After the release exists, and after nothing else: neither publish nor
    # release waits for this job.
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      # id-token: sign the attestation with this workflow's OIDC identity.
      # attestations: store it with the repository, where
      #   `gh attestation verify` finds it.
      # contents: attach the bundle to the release.
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Attest the wheel and the sdist
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attach the provenance bundle to the release
        # One file for both distributions: a Sigstore bundle carrying an
        # in-toto statement with a SLSA provenance predicate, whose subjects
        # are the two files by SHA-256. --clobber makes a re-run replace it.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${BUNDLE}" palimpsests.intoto.jsonl
          gh release upload "${GITHUB_REF_NAME}" \
            palimpsests.intoto.jsonl \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
