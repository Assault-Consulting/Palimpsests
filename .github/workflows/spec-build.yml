name: spec-build

on:
  push:
    branches: [main]
    paths: ["standards/**", ".github/workflows/spec-build.yml"]
  pull_request:
    branches: [main]
    paths: ["standards/**", ".github/workflows/spec-build.yml"]

permissions:
  contents: read

jobs:
  spec-build:
    name: spec-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Ruby ships preinstalled on the ubuntu runner image; kramdown-rfc
      # is a gem, xml2rfc is Python.
      - name: Install toolchain (xml2rfc + kramdown-rfc)
        run: |
          python -m pip install --upgrade pip
          pip install xml2rfc
          sudo gem install kramdown-rfc

      # Render every draft source to RFCXML v3 and text, then check that
      # every literal block survived verbatim. A source that does not
      # render, or renders into something other than what it says, fails
      # the job. With no sources present the job reports that and passes.
      - name: Build draft sources and check literal blocks
        run: |
          shopt -s nullglob
          files=(standards/draft-*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no draft sources in standards/ yet — pipeline verified, nothing to build"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::group::kdrfc -3 $f"
            kdrfc -3 "$f"
            echo "::endgroup::"
            python standards/check_render.py "$f" "${f%.md}.txt"
          done
          ls -la standards/

      # The artifact is what gets submitted to the datatracker — never a
      # local render (see standards/README.md).
      - name: Upload rendered drafts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4 branch head, 2025-03-19
        with:
          name: rendered-drafts
          path: |
            standards/draft-*.xml
            standards/draft-*.txt
          if-no-files-found: ignore
