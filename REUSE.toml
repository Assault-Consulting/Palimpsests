# REUSE configuration — https://reuse.software (REUSE.toml, spec 3.3)
#
# Declares copyright and licensing for every file in the repository in one
# place, so `reuse lint` passes without a per-file SPDX header in each
# source file. This is the machine-readable, tool-verifiable statement that
# every file has an explicit, known license — the signal OpenSSF Scorecard
# and grant reviewers (IP provenance) look for.
#
# Everything in the project is Apache-2.0, copyright Assault Consulting.
# The globs below cover the whole tree; add a more specific block above the
# catch-all only if a vendored file with a different license is ever added.
#
# The license text itself lives at LICENSES/Apache-2.0.txt (the location
# REUSE expects). The root LICENSE file is kept as the conventional,
# human-facing copy.

version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Assault Consulting"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["docs/specs/pala-1/PALA-1.md", "docs/specs/pala-1/test-vectors.json", "docs/specs/pala-1/profiles/inference-vectors.json", "docs/specs/pala-1/profiles/robotics.md", "docs/specs/pala-1/profiles/inference.md"]
precedence = "override"
SPDX-FileCopyrightText = "Assault Consulting"
SPDX-License-Identifier = "CC0-1.0"

# The two PALA-1 reference implementations carry the same public-domain
# dedication as the spec they accompany, so a third party implementing the
# format independently is not bound by Apache terms. Their in-file SPDX headers
# say CC0-1.0; this override keeps the Apache catch-all above from also applying
# (without it the aggregate precedence records them as Apache-2.0 AND CC0-1.0).
[[annotations]]
path = ["docs/specs/pala-1/gen_vectors.py", "docs/specs/pala-1/palaudit_ref.py"]
precedence = "override"
SPDX-FileCopyrightText = "Assault Consulting"
SPDX-License-Identifier = "CC0-1.0"
